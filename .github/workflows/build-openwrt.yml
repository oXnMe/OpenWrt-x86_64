name: Build OpenWrt x86_64

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      bxplug:
        description: '是否添加 bxplug(BeeconMini)'
        required: false
        type: boolean
        default: true
      istore:
        description: '是否添加 istore'
        required: false
        type: boolean
        default: false
      uugamebooster:
        description: '是否添加 uugamebooster'
        required: false
        type: boolean
        default: true
      passwall2:
        description: '是否添加 passwall2'
        required: false
        type: boolean
        default: true
      ssrp:
        description: '是否添加 ssrp'
        required: false
        type: boolean
        default: false
      komari-agent:
        description: '是否添加 komari-agent'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: 0 19 * * *

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  ENABLE_BXPLUG: ${{ github.event.inputs.bxplug || 'true' }}
  ENABLE_ISTORE: ${{ github.event.inputs.istore || 'false' }}
  ENABLE_UUGAMEBOOSTER: ${{ github.event.inputs.uugamebooster || 'true' }}
  ENABLE_PASSWALL2: ${{ github.event.inputs.passwall2 || 'true' }}
  ENABLE_SSRP: ${{ github.event.inputs.ssrp || 'false' }}
  ENABLE_KOMARI_AGENT: ${{ github.event.inputs.komari-agent || 'true' }}

jobs:
  build:
    # 固定镜像：ubuntu-latest 将于 2026-10 迁移到 Ubuntu 26，工具链/依赖包名变动
    # 会直接打断构建。这里锁定已验证通过的 24.04，升级时手动改这一行。
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: write

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Checkout
      uses: actions/checkout@main

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        preinstalled-runtimes: true
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        # 必须为 false：true 会 swapoff -a 并删掉 /mnt/swapfile，让 runner 失去
        # 4GB swap 兜底。make -j4 编 Go/C++ 包并打包 700MB rootfs 时内存峰值一旦
        # 越界，OOM 会直接杀掉 runner agent，表现为「lost communication with the
        # server」且日志里没有任何报错（2026-11-05 #1283、11-06 #1284 即此原因）。
        # 代价是少 4GB 磁盘；磁盘不够会明确报 No space left，比静默猝死好排查。
        swap-storage: false

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
        # 关键：让 needrestart 只列出、不重启服务。见下方说明。
        NEEDRESTART_MODE: l
        # 终极开关：整个 apt 事务里彻底禁用 needrestart。因为 Ubuntu 24.04 的
        # /etc/apt/apt.conf.d/99needrestart 可能带 -m u 参数强制自动模式，
        # 命令行参数会盖掉 conf.d 里的 restart 设置。SUSPEND 优先于两者。
        NEEDRESTART_SUSPEND: "1"
      run: |
        # Ubuntu 24.04 的 needrestart 默认是自动重启模式。apt 装完这一大堆依赖后，
        # 它会把 systemd-networkd / systemd-resolved / systemd-journald 一起重启，
        # runner agent 到 GitHub 的长连接随即断开，平台报 "hosted runner lost
        # communication with the server"，且日志因 journald 重启而来不及上传
        # （2026-11-07 #1285 就是这么死的，日志档案是个 22 字节的空 zip）。
        # 这里改成 list 模式，并额外把关键服务加入永不重启名单，双保险。
        sudo mkdir -p /etc/needrestart/conf.d
        printf '%s\n%s\n' \
          '$nrconf{restart} = "l";' \
          '$nrconf{override_rc}{qr(^(systemd-networkd|systemd-resolved|systemd-logind|systemd-journald|dbus|ssh)$)} = 0;' \
          | sudo tee /etc/needrestart/conf.d/99-actions-no-restart.conf > /dev/null
        cat /etc/needrestart/conf.d/99-actions-no-restart.conf
        # 加超时保护：镜像源卡死时 apt 会无限重试，2026-11-07 #1285 就在这一步
        # 卡了 68 分钟后 runner 失联。超时后立即失败，避免白白占着 runner。
        sudo -E timeout 300 apt-get -qq update || { echo "::error::apt update 超时或失败"; exit 1; }
        sudo -E timeout 1500 apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev || { echo "::error::apt install 超时或失败"; exit 1; }
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: Clone source code
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # make download 在 -j 并行模式下即使有源码包 404 也可能返回 0，
        # 之前因此把问题拖进编译阶段，白烧一小时。这里显式拦截。
        set -o pipefail
        make download -j$(nproc) 2>&1 | tee download.log || true
        if grep -q "Download failed" download.log; then
          echo "::error::源码包下载失败，提前终止"
          grep -B3 "Download failed" download.log | tail -n 30
          exit 1
        fi
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 心跳：每 5 分钟打一次磁盘/内存/时间戳。runner 静默失联时日志会突然断掉，
        # 有了这些采样就能判断死亡瞬间是磁盘满、内存耗尽，还是纯粹被回收。
        ( while sleep 300; do
            echo "---- heartbeat $(date -u +%H:%M:%S) ----"
            df -h / /mnt 2>/dev/null | tail -n +1
            free -h | head -2
          done ) &
        WATCHDOG=$!
        # 只保留一次详细重试，避免同一个错误连跑三遍浪费一小时
        set +e
        make -j$(nproc) || make -j1 V=s
        MAKE_RC=$?
        set -e
        kill $WATCHDOG 2>/dev/null || true
        [ "$MAKE_RC" -eq 0 ] || exit "$MAKE_RC"
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf openwrt-x86-64-generic-kernel.bin openwrt-x86-64-generic-squashfs-rootfs.img.gz packages feeds.buildinfo version.buildinfo
        sed -i '/kernel\|rootfs\|feeds\|version/d' sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_date=$(date +"%Y%m%d")" >> $GITHUB_OUTPUT
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "* 仅编译x86-64-generic-squashfs-combined-efi固件" > release.txt
        echo "* 默认管理 IP：192.168.123.1 默认密码：password" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ steps.tag.outputs.release_date }} x86_64 固件
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Remove old workflow runs and Releases
      uses: ophub/delete-releases-workflows@main
      with:
        delete_releases: true
        releases_keep_latest: 10
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 3
        gh_token: ${{ secrets.GITHUB_TOKEN }}
