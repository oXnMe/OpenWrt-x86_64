name: Build OpenWrt x86_64

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      bxplug:
        description: '是否添加 bxplug(BeeconMini)'
        required: false
        type: boolean
        default: true
      istore:
        description: '是否添加 istore'
        required: false
        type: boolean
        default: false
      uugamebooster:
        description: '是否添加 uugamebooster'
        required: false
        type: boolean
        default: true
      passwall2:
        description: '是否添加 passwall2'
        required: false
        type: boolean
        default: true
      ssrp:
        description: '是否添加 ssrp'
        required: false
        type: boolean
        default: false
      komari-agent:
        description: '是否添加 komari-agent'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: 0 19 * * *

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  ENABLE_BXPLUG: ${{ github.event.inputs.bxplug || 'true' }}
  ENABLE_ISTORE: ${{ github.event.inputs.istore || 'false' }}
  ENABLE_UUGAMEBOOSTER: ${{ github.event.inputs.uugamebooster || 'true' }}
  ENABLE_PASSWALL2: ${{ github.event.inputs.passwall2 || 'true' }}
  ENABLE_SSRP: ${{ github.event.inputs.ssrp || 'false' }}
  ENABLE_KOMARI_AGENT: ${{ github.event.inputs.komari-agent || 'true' }}

jobs:
  build:
    # 固定镜像：ubuntu-latest 将于 2026-10 迁移到 Ubuntu 26，工具链/依赖包名变动
    # 会直接打断构建。这里锁定已验证通过的 24.04，升级时手动改这一行。
    runs-on: ubuntu-24.04

    # 故障记录（2026-11-07 核实，勿再重复归因到本文件配置）：
    # 11-05 至 11-07 期间共三次失败（#1283、#1284、#1287 attempt 1），平台注解
    # 全都是 "The hosted runner lost communication with the server"，停止点分别
    # 落在编译后段、编译尾声和 apt 阶段，没有规律。决定性证据是同一份代码一死
    # 一活：#1282 成功而 #1283/#1284 失败，跑的都是 commit f489740；
    # #1287 attempt 1 卡死 100 分钟（Init 步骤 status 永远停在 in_progress），
    # attempt 2 在同一 commit 8017ebf 上用 88 分钟完整跑完并发版。
    # 结论：平台侧 runner 实例偶发失联，与 workflow 配置无关。现有缓解手段是
    # retry-failed-build.yml —— 它已在 11-07 06:46 按设计触发并救回了 #1287。

    permissions:
      contents: write
      actions: write

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Checkout
      uses: actions/checkout@main

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        preinstalled-runtimes: true
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        # 保留 runner 自带的 4GB swap 兜底：make -j4 编 Go/C++ 包并打包 700MB
        # rootfs 时内存峰值可能越界，有 swap 至少不会直接被 OOM 杀掉。
        # 代价是少 4GB 磁盘；磁盘不够会明确报 No space left，比静默猝死好排查。
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
        # 关键：让 needrestart 只列出、不重启服务。见下方说明。
        NEEDRESTART_MODE: l
        # 终极开关：整个 apt 事务里彻底禁用 needrestart。因为 Ubuntu 24.04 的
        # /etc/apt/apt.conf.d/99needrestart 可能带 -m u 参数强制自动模式，
        # 命令行参数会盖掉 conf.d 里的 restart 设置。SUSPEND 优先于两者。
        NEEDRESTART_SUSPEND: "1"
      run: |
        # 打开命令回显。apt 的 -qq 会把进度全部吞掉，一旦卡住，日志看起来就停在
        # 原地、无法判断卡在哪条命令。需要 set -x 的原因很实际：runner 猝死时
        # 整个 step 的日志拿不到（#1285 的日志档案就是个 22 字节的空 zip），但卡住
        # 期间的日志是实时流式输出的 —— 当时能看见 "needrestart is suspended"
        # 就证明了这点。加了 set -x，下次卡住能当场定位到具体命令。
        set -x
        # needrestart 防护：Ubuntu 24.04 默认会自动重启 ftrace 之外的过期服务，
        # apt 装完这一大批依赖后理论上会把 systemd-networkd / systemd-resolved
        # 一起重启，从而断掉 runner agent 的长连接。
        # 需明确记录：#1287 attempt 1 里这套防护已经生效（日志打印
        # "packages have been installed but needrestart is suspended"）却仍然
        # 失联，所以它不是那几次失败的原因，真正原因见 jobs.build 处的故障记录。
        # 这里保留防护只因为代价为零，能挡住 needrestart 确实重启服务的场景。
        sudo mkdir -p /etc/needrestart/conf.d
        printf '%s\n%s\n' \
          '$nrconf{restart} = "l";' \
          '$nrconf{override_rc}{qr(^(systemd-networkd|systemd-resolved|systemd-logind|systemd-journald|dbus|ssh)$)} = 0;' \
          | sudo tee /etc/needrestart/conf.d/99-actions-no-restart.conf > /dev/null
        cat /etc/needrestart/conf.d/99-actions-no-restart.conf
        # apt 超时与重试：原来 install 给 600 秒。正常整个 Init 只要 135–139 秒
        # （11-21、11-23 两次成功构建），11-24 却撞满 600 秒被杀，当天两次自动
        # 重试都倒在同一个闸门上。真正的病因见下面换镜像那段 —— 加速之后的
        # 1200 秒 × 2 只是兜底，用来在镜像再次劣化时给出明确失败而不是无限等待。
        # apt install 是增量的：第一次已装好的包第二次不会重装，重试能接着往下走。
        #
        # 另外给 Acquire 加停滞超时和重试：单个包卡在 TCP 上不动会把整个 1200 秒
        # 预算耗光，改成 30 秒无数据即重连，把「卡死」变成「换连接继续」。
        #
        # install 详细程度从 -qq 降到 -q：-qq 会把 Get/Unpacking 全吞掉，卡住时
        # 日志里只剩一行命令、一个耗时，完全无法判断卡在哪个包 —— 11-24 的两次
        # 失败就是这样，只有 661 秒这一个线索。
        APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        APT_PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev"
        # 换掉 apt 默认镜像的优先级顺序（2026-11-24 实测定位，不是推测）。
        # runner 镜像把 /etc/apt/apt-mirrors.txt 的 priority:1 写死成
        # us-east-2.ec2.archive.ubuntu.com，而它当时只有 11 kB/s：79MB 的
        # texlive-bibtex-extra 跑满 20 秒只下了 225KB。同一时刻同一个文件，
        # archive.ubuntu.com 用 0.16 秒下完，azure.archive.ubuntu.com 0.75 秒，
        # mirrors.edge.kernel.org 5.8 秒。这次 install 要下 724MB，按 11 kB/s
        # 需要一小时以上 —— 1200 秒的额度再怎么调都不够，所以必须换源，
        # 而不是继续加超时（加到 3600 秒只会把构建拖成 3 小时）。
        # 保留 mirror+file 机制不变（apt 仍会在出错时按 priority 回退），
        # 只把快的镜像排到前面。注意 printf 的格式串里必须是真 Tab。
        printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\nhttps://security.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        cat /etc/apt/apt-mirrors.txt
        sudo -E timeout 300 apt-get -q "${APT_OPTS[@]}" update || { echo "::error::apt update 超时或失败"; exit 1; }
        APT_OK=0
        for APT_I in 1 2; do
          echo "===== apt install attempt $APT_I/2 ====="
          set +e
          sudo -E timeout 1200 apt-get -q "${APT_OPTS[@]}" install $APT_PKGS
          APT_RC=$?
          set -e
          if [ "$APT_RC" -eq 0 ]; then
            APT_OK=1
            break
          fi
          if [ "$APT_RC" -eq 124 ] || [ "$APT_RC" -eq 137 ]; then
            echo "::warning::第 $APT_I 次 apt install 超时（1200s），镜像源可能变慢"
          else
            echo "::warning::第 $APT_I 次 apt install 失败（rc=$APT_RC）"
          fi
          if [ "$APT_I" -lt 2 ]; then
            echo "===== 10 秒后重试，已装好的包不会重装 ====="
            sleep 10
          fi
        done
        if [ "$APT_OK" -ne 1 ]; then
          echo "::error::apt install 两次尝试均失败"
          exit 1
        fi
        # autoremove 只是清理孤儿包，不承担构建职责：超时就跳过，不要卡死在这里。
        sudo -E timeout 180 apt-get -qq autoremove --purge || echo "::warning::autoremove 超时或失败，已跳过"
        sudo -E timeout 120 apt-get -qq clean || true
        # timedatectl 需要 dbus 上的 systemd-timedated 响应，那个服务异常时会无限等待
        sudo -E timeout 60 timedatectl set-timezone "$TZ" || echo "::warning::设置时区失败，继续"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: Clone source code
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # 下载阶段的目标：只在「确认拿全了源码」时才进入编译，任何不确定都失败退出。
        #
        # 三次事故催生了现在这三条策略：
        # 1) 卡死（2026-11-15 #43688890623）：停在 util-linux 后彻底静默 4 小时 29 分，
        #    挂到 6 小时上限被平台取消，编译一步没开始。卡死不是「失败」而是永不返回，
        #    靠 grep 日志永远够不着 —— 必须用 timeout 转成明确退出码。
        # 2) 失败被放过（2026-11-16 attempt 1）：erofs-utils 源码包拿不到，但下载
        #    阶段照样判成功，白烧 18 分钟到编译阶段才在同一个包上炸掉。
        #    实测那次日志 316 行里没有任何 `make: ***` 收尾，说明 -j 并行下某个包
        #    failed to build 时 make 整体仍可能返回 0 —— 所以退出码和日志必须双检。
        # 3) 单次抖动（2026-11-16 attempt 2）：又是 util-linux 卡住 37 分钟被超时打断。
        #    两天两次同一个包，说明 runner 到 kernel.org 系源站的链路不稳定，
        #    一次失败不代表拿不到 —— 要重试，且靠 dl/ 缓存只补缺失文件。
        #
        # 关键背景：erofs-utils / util-linux 的源码都要从 git.kernel.org / KERNEL
        # 镜像取，而 OpenWrt 的 sources.* 镜像对它们一直是 404（实测 1.8.9 与
        # 1.8.10 均如此），没有第二条可用源。所以这两类包只能重试，改 PKG_SOURCE_URL
        # 指向 GitHub archive 会连带改 PKG_HASH 和目录名，出错概率大于收益。
        #
        # 时间额度：正常整步 2-8 分钟（2026-11-15 两次成功构建分别为 2 分钟和 8 分钟），
        # 单次给 30 分钟远超正常值；一旦真开始卡必然撞满，不会误杀正常构建。
        # 最坏 3 x 30 分钟 + 2 x 30 秒间隔 ≈ 91 分钟给出明确结论，不再白等 6 小时。
        # pipefail 必须保留，否则超时态会被 tee 的 0 退出码盖掉。
        set -o pipefail
        DL_MAX=3
        DL_TIMEOUT=1800
        DL_OK=0
        for DL_I in $(seq 1 $DL_MAX); do
          echo "===== download attempt $DL_I/$DL_MAX ====="
          DL_LOG="download-$DL_I.log"
          set +e
          timeout -k 60 $DL_TIMEOUT make download -j$(nproc) 2>&1 | tee "$DL_LOG"
          DL_RC=$?
          set -e
          DL_FAIL=""
          if [ "$DL_RC" -eq 124 ] || [ "$DL_RC" -eq 137 ]; then
            DL_FAIL="超时（${DL_TIMEOUT}s 零输出），判定为网络卡死"
          elif [ "$DL_RC" -ne 0 ]; then
            DL_FAIL="make 返回非零退出码 $DL_RC"
          elif grep -qE "Download failed|failed to build|No more mirrors to try" "$DL_LOG"; then
            DL_FAIL="日志里有下载失败的包（make 仍返回 0，-j 并行下的已知行为）"
          fi
          if [ -z "$DL_FAIL" ]; then
            DL_OK=1
            break
          fi
          echo "::warning::第 $DL_I 次下载判定失败：$DL_FAIL"
          # 只打印失败摘要，完整日志留在 $DL_LOG 供下载
          grep -E "Download failed|failed to build|ERROR:|curl: \(|No more mirrors" "$DL_LOG" | tail -n 15 || true
          if [ "$DL_I" -lt "$DL_MAX" ]; then
            echo "===== 30 秒后重试，dl/ 里已下好的文件会保留，只补缺失的 ====="
            sleep 30
          fi
        done
        if [ "$DL_OK" -ne 1 ]; then
          echo "::error::$DL_MAX 次下载尝试全部失败，终止构建（不进入编译阶段）"
          exit 1
        fi
        echo "===== 源码包下载完成（第 $DL_I 次尝试）====="
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 心跳：每 5 分钟打一次磁盘/内存/时间戳。runner 静默失联时日志会突然断掉，
        # 有了这些采样就能判断死亡瞬间是磁盘满、内存耗尽，还是纯粹被回收。
        ( while sleep 300; do
            echo "---- heartbeat $(date -u +%H:%M:%S) ----"
            df -h / /mnt 2>/dev/null | tail -n +1
            free -h | head -2
          done ) &
        WATCHDOG=$!
        # 编译策略：-j 并行容易撞上工具链的并行 race（实测 tools/elfutils 在 -j4 下
        # 报 failed to build，重跑一次就过），所以给 -j 两次机会，最后才退到单线程。
        # 2026-11-14 的两次构建（43532225888 用 152 分钟、43650287281 用 197 分钟）
        # 就是只给一次机会：一撞 race 立刻掉进 make -j1 V=s，日志里 2.7 万行详细
        # 编译命令，比正常 62 分钟多花两小时。而重试 -j 是断点续编，只补失败包和
        # 下游，代价通常十分钟量级 —— 用十分钟换两小时，值得。
        set +e
        make -j$(nproc) || make -j$(nproc) || make -j1 V=s
        MAKE_RC=$?
        set -e
        kill $WATCHDOG 2>/dev/null || true
        [ "$MAKE_RC" -eq 0 ] || exit "$MAKE_RC"
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      # 必须挂在 compile 成功之后：编译被跳过时 bin/targets 不存在，cd 会失败，
      # 于是前面已经失败了的构建上再多亮一个红叉（2026-11-24 两次尝试就是这样），
      # 掩盖真正的失败点。
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf openwrt-x86-64-generic-kernel.bin openwrt-x86-64-generic-squashfs-rootfs.img.gz packages feeds.buildinfo version.buildinfo
        sed -i '/kernel\|rootfs\|feeds\|version/d' sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_date=$(date +"%Y%m%d")" >> $GITHUB_OUTPUT
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "* 仅编译x86-64-generic-squashfs-combined-efi固件" > release.txt
        echo "* 默认管理 IP：192.168.123.1 默认密码：password" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ steps.tag.outputs.release_date }} x86_64 固件
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Remove old workflow runs and Releases
      uses: ophub/delete-releases-workflows@main
      with:
