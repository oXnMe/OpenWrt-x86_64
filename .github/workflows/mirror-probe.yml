name: Mirror probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Current apt mirror config
        run: |
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "(none)"

      - name: Resolve real package URLs
        run: |
          sudo apt-get update -qq
          sudo apt-get -y --print-uris install texlive-bibtex-extra texlive-luatex lmodern 2>/dev/null \
            | awk -F"'" '/^\x27http/{print $4, $2}' | sort -rn | head -5 \
            | tee /tmp/top.txt
          echo "=== total ==="
          sudo apt-get -y --print-uris install texlive-bibtex-extra texlive-luatex lmodern 2>/dev/null \
            | awk -F"'" '/^\x27http/{s+=$4} END{print s/1048576 " MB"}'

      - name: Probe throughput on top file
        run: |
          P=$(head -1 /tmp/top.txt | awk '{print $2}' | sed 's|^http://[^/]*||')
          echo "path: $P"
          for m in \
            http://us-east-2.ec2.archive.ubuntu.com/ubuntu \
            http://azure.archive.ubuntu.com/ubuntu \
            http://archive.ubuntu.com/ubuntu \
            http://mirrors.edge.kernel.org/ubuntu \
            http://mirrors.aliyun.com/ubuntu \
            http://mirrors.tuna.tsinghua.edu.cn/ubuntu ; do
            echo "=== $m ==="
            curl -sS -o /dev/null --max-time 20 \
              -w 'code=%{http_code} bytes=%{size_download} speed=%{speed_download} time=%{time_total}\n' \
              "$m$P" 2>&1 || echo "CURL_FAILED"
          done
