name: Mirror probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve real package URLs and sizes
        run: |
          sudo apt-get update -qq
          sudo apt-get -y --print-uris install texlive-bibtex-extra texlive-luatex lmodern 2>/dev/null \
            | python3 -c "
          import sys, re
          rows = []
          for line in sys.stdin:
              m = re.match(r\"'([^']+)'\s+(\S+)\s+(\d+)\", line)
              if m:
                  rows.append((int(m.group(3)), m.group(1)))
          rows.sort(reverse=True)
          for size, url in rows[:3]:
              print(size, url)
          print('TOTAL_MB', sum(s for s, _ in rows) // 1048576)
          " | tee /tmp/top.txt

      - name: Probe throughput on the largest file
        run: |
          P=$(head -1 /tmp/top.txt | awk '{print $2}' | sed 's|^https\?://[^/]*||')
          echo "path: $P"
          for m in \
            http://us-east-2.ec2.archive.ubuntu.com/ubuntu \
            http://azure.archive.ubuntu.com/ubuntu \
            http://archive.ubuntu.com/ubuntu \
            http://mirrors.edge.kernel.org/ubuntu \
            http://mirrors.aliyun.com/ubuntu \
            http://mirrors.tuna.tsinghua.edu.cn/ubuntu ; do
            echo "=== $m ==="
            curl -sSL -o /dev/null --max-time 20 \
              -w 'code=%{http_code} bytes=%{size_download} speed_kBps=%{speed_download} time=%{time_total}\n' \
              "$m$P" 2>&1 | sed 's/\(speed_kBps=[0-9]*\)\([0-9]\{3\}\)/\1.\2/' || echo "CURL_FAILED"
          done
